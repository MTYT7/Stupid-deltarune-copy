<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stupid Deltarune Copy</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050509;color:#f5f3f7;font-family:Georgia,serif;min-height:100vh;display:grid;place-items:center;padding:16px}.game{width:min(900px,100%);border:3px solid #eee;background:#09090d;box-shadow:0 0 0 5px #24242b,0 18px 70px #000}.top{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:2px solid #ddd;font:14px monospace;flex-wrap:wrap}.screen{height:min(62vh,500px);min-height:320px;position:relative;overflow:hidden;background:#09090e}.room{position:absolute;inset:0;background:linear-gradient(#151321 0 66%,#24202b 66%);}.room:before{content:"";position:absolute;left:8%;right:8%;top:12%;height:53%;border:5px solid #494153;background:repeating-linear-gradient(90deg,#171421 0 70px,#272033 72px 75px)}.floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(0deg,#322b37 0 3px,#28232f 4px 43px)}.door{position:absolute;right:12%;bottom:22%;width:75px;height:125px;border:5px solid #aaa;background:#14121c;box-shadow:inset 0 0 20px #665080}.hero{position:absolute;width:28px;height:42px;background:#e8e7eb;border:3px solid #17151d;left:48%;bottom:23%;image-rendering:pixelated}.hero:before{content:"";position:absolute;width:24px;height:13px;background:#16151d;top:-9px;left:-1px}.npc{position:absolute;width:36px;height:48px;bottom:23%;left:23%;background:#8cbdc4;border:3px solid #111}.npc:before{content:"";position:absolute;top:8px;left:5px;width:20px;height:7px;background:#17151c}.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#d9d3df;font:13px monospace;text-shadow:1px 2px #000}.dialog{position:absolute;left:4%;right:4%;bottom:4%;min-height:112px;background:#050508;border:3px solid #f4f1f5;padding:15px 18px;display:none;font-size:19px;line-height:1.45;z-index:4}.dialog.show{display:block}.speaker{font:bold 14px monospace;color:#f4d879;margin-bottom:7px}.battle{position:absolute;inset:0;background:#050509;display:none;padding:18px}.battle.show{display:flex;flex-direction:column}.enemy{height:35%;display:grid;place-items:center;font-size:68px;filter:drop-shadow(0 0 12px #9d75c9)}.enemyname{text-align:center;font:16px monospace}.battlelog{font:15px monospace;text-align:center;min-height:30px}.menu{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:auto}.menu button,.dialog button,.controls button{background:#08080b;border:2px solid #f4a83d;color:#ffbd53;padding:9px 17px;font:bold 17px monospace;cursor:pointer}.menu button:hover,.dialog button:hover{background:#3a2516}.arena{height:150px;width:min(430px,90%);border:3px solid white;margin:8px auto;position:relative;background:#09090d;overflow:hidden}.soul{position:absolute;width:14px;height:14px;background:#ff304f;transform:rotate(45deg);left:50%;top:75%;box-shadow:0 0 10px #ff304f}.bullet{position:absolute;width:12px;height:12px;background:#eee;border-radius:50%}.hud{font:14px monospace;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}.controls{display:flex;justify-content:center;gap:8px;margin:10px}.controls button{font-size:13px}.footer{padding:12px;border-top:2px solid #ddd;font:12px monospace;color:#bdb8c5;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}button:focus-visible{outline:3px solid white} .hidden{display:none!important}
</style></head><body><main class="game"><div class="top"><b>STUPID DELTARUNE COPY</b><span id="chapter">CHAPTER 1 — THE LOST HALL</span><span id="clock">HP 20/20</span></div>
<div class="screen" id="screen"><div class="room" id="room"><div class="floor"></div><div class="door"></div><div class="npc" id="npc"></div><div class="hero" id="hero"></div><div class="hint" id="hint">ARROW KEYS / WASD TO MOVE · ENTER TO INTERACT</div></div>
<div class="dialog" id="dialog"><div class="speaker" id="speaker">???</div><div id="line"></div><div style="text-align:right;margin-top:10px"><button id="advance">CONTINUE ▼</button></div></div>
<div class="battle" id="battle"><div class="enemy" id="enemy">♟</div><div class="enemyname" id="enemyname">THE HALL MONITOR</div><div class="battlelog" id="battlelog">It blocks the way.</div><div class="arena hidden" id="arena"><div class="soul" id="soul"></div></div><div class="menu" id="battlemenu"><button data-act="FIGHT">FIGHT</button><button data-act="ACT">ACT</button><button data-act="ITEM">ITEM</button><button data-act="MERCY">MERCY</button></div><div class="hud"><span id="hp">HP 20/20</span><span id="enemyhp">ENEMY 30/30</span><span id="items">BANDAGE × 2</span></div><div class="controls hidden" id="dodgecontrols"><button data-move="left">◀ LEFT</button><button data-move="right">RIGHT ▶</button><button id="dodgeDone">SURVIVE</button></div></div></div>
<div class="footer"><span>Arrow keys/WASD · Enter interact/advance</span><span><button id="save" style="background:none;color:#ddd;border:1px solid #888;padding:5px 9px">SAVE</button> <button id="load" style="background:none;color:#ddd;border:1px solid #888;padding:5px 9px">LOAD</button> <button id="restart" style="background:none;color:#ddd;border:1px solid #888;padding:5px 9px">RESTART</button></span></div></main>
<script>
const $=id=>document.getElementById(id);let x=48,y=23,hp=20,maxhp=20,bandages=2,enemyHp=30,mode="world",dialogue=[],di=0,turn=0,bullets=[],dodgeTimer=null,bulletTimer=null,invincible=false;
const setHero=()=>{$("hero").style.left=x+"%";$("hero").style.bottom=y+"%"};
function say(who,lines,done){dialogue=lines;di=0;afterDialog=done;$("speaker").textContent=who;$("line").textContent=dialogue[0];$("dialog").classList.add("show");mode="dialog"}
let afterDialog=()=>{};function advance(){if(mode!=="dialog")return;di++;if(di<dialogue.length)$("line").textContent=dialogue[di];else{$("dialog").classList.remove("show");mode="world";afterDialog()}}
$("advance").onclick=advance;
function interact(){if(mode==="dialog"){advance();return}if(mode!=="world")return;if(x<34&&y<39){say("MIRA",["Oh. A person. That's inconvenient.","I'm Mira. I was trying to find the exit, but the hallway keeps getting longer.","There is a door ahead. The door is guarded by something with a clipboard.","You look reasonably expendable. Shall we go together?"],()=>{$("npc").style.background="#d1a4e8";$("hint").textContent="THE DOOR IS WAITING. PRESS ENTER NEAR IT."})}else if(x>68&&y<45){say("???",["HALT.","This corridor is temporarily closed due to an administrative nightmare.","Please defeat the Hall Monitor or present a valid excuse."],startBattle)}else{say("YOU",["You inspect the wall. It is, unfortunately, still a wall."])}}
function move(dx,dy){if(mode!=="world")return;x=Math.max(5,Math.min(91,x+dx));y=Math.max(20,Math.min(65,y+dy));setHero();if(x>85&&y<35){x=80;setHero()}}
document.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(mode==="dialog"&&["Enter"," "].includes(e.key)){advance();return}if(mode==="world"){if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move(-3,0);if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move(3,0);if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")move(0,3);if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")move(0,-3);if(e.key==="Enter")interact()}if(mode==="dodge"){if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveSoul(-12);if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveSoul(12)}});
function startBattle(){$("room").classList.add("hidden");$("battle").classList.add("show");mode="battle";enemyHp=30;turn=0;updateHud();$("battlelog").textContent="The Hall Monitor checks its clipboard. You are not on the list."}
function updateHud(){$("hp").textContent="HP "+hp+"/"+maxhp;$("enemyhp").textContent="ENEMY "+enemyHp+"/30";$("items").textContent="BANDAGE × "+bandages;$("clock").textContent="HP "+hp+"/"+maxhp}
document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>action(b.dataset.act));
function action(a){if(mode!=="battle")return;if(a==="FIGHT"){let dmg=8+Math.floor(Math.random()*5);enemyHp=Math.max(0,enemyHp-dmg);$("battlelog").textContent="You swing with unnecessary confidence. "+dmg+" damage!";updateHud();if(enemyHp===0){winBattle();return}enemyTurn()}
if(a==="ACT"){$("battlelog").textContent="You complimented its clipboard. The Hall Monitor looks slightly less hostile.";enemyHp=Math.max(0,enemyHp-5);updateHud();if(enemyHp===0){winBattle();return}enemyTurn()}
if(a==="ITEM"){if(!bandages){$("battlelog").textContent="No bandages left.";return}if(hp===maxhp){$("battlelog").textContent="You're already fine. Suspiciously fine.";return}bandages--;hp=Math.min(maxhp,hp+9);$("battlelog").textContent="You used a bandage. Recovered 9 HP.";updateHud();enemyTurn()}
if(a==="MERCY"){if(enemyHp<=10){winBattle();return}$("battlelog").textContent="It refuses. It says the paperwork is not complete.";enemyTurn()}}
function enemyTurn(){turn++;mode="dodge";$("battlemenu").classList.add("hidden");$("arena").classList.remove("hidden");$("dodgecontrols").classList.remove("hidden");$("battlelog").textContent="DODGE! Move the SOUL away from the incoming paperwork!";let soul=$("soul");soul.style.left="50%";soul.style.top="75%";bullets=[];for(let i=0;i<7;i++){let q=document.createElement("i");q.className="bullet";q.style.left=(5+i*13)+"%";q.style.top=(-10-Math.random()*90)+"px";$("arena").append(q);bullets.push(q)}let t=0;clearInterval(bulletTimer);bulletTimer=setInterval(()=>{t+=5;bullets.forEach((q,i)=>{q.style.top=(parseFloat(q.style.top)+5+ i%3)+"px";if(parseFloat(q.style.top)>140)q.style.top="-12px"});if(t>=130){clearInterval(bulletTimer);finishDodge()}},60)}
let soulX=50;function moveSoul(d){soulX=Math.max(4,Math.min(90,soulX+d));$("soul").style.left=soulX+"%"}
function finishDodge(){bullets.forEach(q=>q.remove());$("arena").classList.add("hidden");$("dodgecontrols").classList.add("hidden");$("battlemenu").classList.remove("hidden");let damage=3+Math.floor(Math.random()*4);hp=Math.max(0,hp-damage);$("battlelog").textContent="You dodged some forms, but a stapler got you. -"+damage+" HP.";updateHud();if(hp<=0){mode="dead";$("battlelog").textContent="YOU FELL OVER. The paperwork was too powerful.";let b=document.createElement("button");b.textContent="TRY AGAIN";b.onclick=()=>location.reload();$("battlemenu").append(b)}else mode="battle"}
$("dodgeDone").onclick=()=>{clearInterval(bulletTimer);finishDodge()};document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>moveSoul(b.dataset.move==="left"?-12:12));
function winBattle(){clearInterval(bulletTimer);mode="world";$("battle").classList.remove("show");$("room").classList.remove("hidden");$("npc").style.display="none";$("hint").textContent="THE WAY IS OPEN. WALK TO THE DOOR AND PRESS ENTER.";say("MIRA",["You did it. That was almost competent.","The corridor is opening. I can see something on the other side.","I don't think we're at school anymore."],()=>{ $("chapter").textContent="CHAPTER 1 — THE PAPER KINGDOM";$("hint").textContent="TO BE CONTINUED — THE PAPER KINGDOM AWAITS."})}
$("save").onclick=()=>{localStorage.setItem("stupid-deltarune-save",JSON.stringify({x,y,hp,bandages,chapter:$("chapter").textContent}));$("hint").textContent="GAME SAVED."};
$("load").onclick=()=>{let d=JSON.parse(localStorage.getItem("stupid-deltarune-save")||"null");if(!d){$("hint").textContent="NO SAVE FOUND.";return}x=d.x;y=d.y;hp=d.hp;bandages=d.bandages;$("chapter").textContent=d.chapter;setHero();updateHud();$("hint").textContent="SAVE LOADED."};
$("restart").onclick=()=>{if(confirm("Restart from the beginning?"))location.reload()};
setHero();updateHud();
</script></body></html>
